<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breathwork Guide</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Breathwork</h1>

      <section class="controls" aria-label="Session controls">
        <label for="technique">Technique</label>
        <select id="technique">
          <option value="box" selected>Box breathing</option>
          <option value="anchor">Anchor</option>
        </select>
        <label for="durationMinutes">Session length (minutes)</label>
        <input id="durationMinutes" type="number" min="1" max="180" step="1" value="5" />
        <div id="boxPhaseControls">
          <label for="boxPhaseSeconds">Phase duration (seconds)</label>
          <input id="boxPhaseSeconds" type="number" min="1" max="60" step="1" value="4" />
        </div>

        <div class="buttons">
          <button id="startButton" type="button">Start</button>
          <button id="pauseButton" type="button" disabled>Pause</button>
          <button id="resetButton" type="button" disabled>Reset</button>
        </div>
      </section>

      <section class="status" aria-live="polite">
        <p id="phaseLabel" class="phase">Ready</p>
        <p id="phaseCountdown" class="phase-countdown">Phase: --</p>
        <p id="sessionCountdown" class="session-countdown">Session: 05:00</p>
      </section>

      <section class="visual" aria-label="Breathing guide">
        <div class="guide-frame box" id="boxGuide">
          <div class="dot" id="dot"></div>
        </div>
        <div class="guide-frame anchor hidden" id="anchorGuide">
          <svg class="anchor-svg" viewBox="0 0 560 224" preserveAspectRatio="none" aria-hidden="true">
            <path id="anchorPath" class="anchor-path" d="" />
          </svg>
          <div class="dot anchor-dot" id="anchorDot"></div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
